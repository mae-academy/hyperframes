<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The R-Matrix Trick: The Complete Masterclass</title>
<meta name="viewport" content="width=1080, height=1920" />
<script src="{{GSAP_SRC}}"></script>
<style>
  /* KaTeX 0.16.11 (MIT): woff2 only, shipped in assets/fonts */
{{KATEX_CSS}}

  :root { --bg:#0A0A10; --grid:#161622; --blue:#0088FF; --purple:#B026FF; --red:#FF0044; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { width: 1080px; height: 1920px; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: "KaTeX_Main", serif; font-weight: 700; font-style: normal;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
    background-size: 60px 60px; }
  #root div, #root svg { box-sizing: border-box; }
  .abs { position: absolute; }
  .katex { font-size: 1.1em; font-weight: 400; }

  /* ---------- zone 1: header, centred on x = 540 ---------- */
  #hdr { left: 0; top: 110px; width: 1080px; height: 200px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  #title { margin-top: 35px; font-size: 58px; line-height: 70px; color: var(--red); white-space: nowrap; text-shadow: 0 0 28px rgba(255,0,68,.45); }
  #subtitle { margin-top: 3px; font-size: 34px; line-height: 44px; color: var(--purple); white-space: nowrap; }
  #rule { margin-top: 17px; width: 120px; height: 3px; background: linear-gradient(90deg, var(--red), var(--purple)); }

  /* ---------- zone 2: the circuit arena (always fully visible) ---------- */
  #plate { left: 90px; top: 340px; width: 900px; height: 550px; border-radius: 32px; background: rgba(30,30,46,.52); border: 1px solid rgba(255,255,255,.08); overflow: hidden; }
  #wm { position: absolute; left: 0; top: 511px; width: 900px; height: 38px; text-align: center; font-size: 36px; line-height: 38px; color: #fff; opacity: .04; z-index: 0; white-space: nowrap; }
  #circuit { position: absolute; left: 0; top: 0; width: 900px; height: 550px; z-index: 1; }
  #labels { position: absolute; left: 0; top: 0; width: 900px; height: 550px; z-index: 2; }
  .wire { stroke: #8DB8FF; stroke-width: 4; fill: none; stroke-linecap: round; filter: drop-shadow(0px 0px 5px rgba(0,136,255,.55)); }
  .res { fill: none; stroke: var(--blue); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0px 0px 6px rgba(0,136,255,.6)); }
  .mask { fill: #1b1b2a; }
  .src { fill: #1b1b2a; stroke: var(--red); stroke-width: 5; filter: drop-shadow(0px 0px 6px rgba(255,0,68,.6)); }
  .pm { stroke: var(--red); stroke-width: 4; fill: none; stroke-linecap: round; }
  .gl { stroke: #8DB8FF; stroke-width: 4; stroke-linecap: round; }
  .node { fill: #fff; stroke: #1b1b2a; stroke-width: 3; filter: drop-shadow(0px 0px 5px rgba(255,255,255,.6)); }
  .marc { fill: none; stroke: #EAF2FF; stroke-width: 4; stroke-linecap: round; }
  .mhead { fill: var(--blue); }
  .lb { position: absolute; color: #fff; white-space: nowrap; }
  .elabel { font-size: 24px; }
  .lp { display: inline-block; }
  .lnum { display: inline-block; margin: 0 1px 0 6px; } .mlabel { font-size: 34px; } .gtag { font-size: 22px; opacity: .85; }
  .trail { fill: none; stroke: var(--blue); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0px 0px 8px rgba(0,136,255,.95)); }
  .perim { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0px 0px 10px rgba(0,136,255,.95)); }
  .head { opacity: 0; }

  .strike { position: absolute; left: -10px; right: -10px; top: 50%; height: 5px; margin-top: -2px; background: var(--red); border-radius: 3px; }

  /* ---------- zone 3: the arithmetic banner, 820 x 110 ---------- */
  #banner { left: 130px; top: 920px; width: 820px; height: 120px; border-radius: 24px; background: rgba(255,0,68,.08); border: 2px solid rgba(255,0,68,.55); }
  .bv { position: absolute; left: 0; top: 0; width: 816px; height: 116px; opacity: 0; }
  #bv-h2 { opacity: 1; }
  /* hook: full-width graphic card inside zone 2 (the plate clips it): crossed-out equations, shatters into shards at 0.8 s */
  #hkc { position: absolute; left: 0; top: 0; width: 900px; height: 550px; z-index: 6; }
  .sh { position: absolute; background: #14060c; }
  #hk-bd { position: absolute; left: 2px; top: 2px; width: 892px; height: 542px; border-radius: 30px; border: 3px solid rgba(255,0,68,.85); box-shadow: inset 0 0 40px rgba(255,0,68,.3); }
  .hk-s { position: absolute; left: 0; width: 900px; text-align: center; font-size: 30px; line-height: 40px; color: #fff; opacity: .85; white-space: nowrap; }
  .strike { position: absolute; left: 40px; right: 40px; top: 50%; height: 5px; margin-top: -2px; background: var(--red); border-radius: 3px; }
  #hk-q { position: absolute; left: 0; top: 330px; width: 900px; text-align: center; font-size: 36px; line-height: 60px; color: var(--red); text-shadow: 0 0 24px rgba(255,0,68,.5); white-space: nowrap; }
  .bt { position: absolute; left: 0; top: 0; width: 816px; height: 116px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; text-align: center; font-size: 34px; line-height: 44px; white-space: nowrap; }
  .btl { display: flex; align-items: center; justify-content: center; }
  .ic { display: inline-block; width: 30px; height: 30px; vertical-align: -5px; margin-left: 8px; }
  .bl { position: absolute; left: 0; width: 816px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 32px; white-space: nowrap; }
  .l1 { top: 7px; } .l2 { top: 59px; }
  .pc { display: inline-block; opacity: .3; }
  .vr { opacity: 0; font-size: 24px; }
  #src-1, #src-2, #src-3 { font-size: 30px; }

  /* ---------- zone 4: glass matrix card, 780 x 460 ---------- */
  #card { left: 150px; top: 1060px; width: 780px; height: 300px; border-radius: 30px; background: rgba(30,30,46,.55); border: 1px solid rgba(255,255,255,.1); }
  #cardin { position: absolute; left: -1px; top: -1px; width: 780px; height: 300px; }
  #eqhead { position: absolute; left: 0; top: 4px; width: 780px; height: 50px; text-align: center; font-size: 38px; line-height: 50px; }
  #brk { position: absolute; left: 0; top: 0; width: 780px; height: 300px; }
  .brk { fill: none; stroke: #EAF2FF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .cell { position: absolute; width: 120px; height: 68px; text-align: center; }
  .vcol { position: absolute; width: 120px; height: 204px; display: grid; grid-template-rows: repeat(3, 68px); grid-template-columns: 120px; }
  .vcol .cell { position: relative; left: auto; top: auto; }
  .cell b { position: absolute; left: 0; top: 0; width: 120px; height: 68px; line-height: 68px; white-space: nowrap; font-weight: 400; }
  .cell .ghost { font-size: 35px; opacity: .45; }
  .cell .val { font-size: 42px; opacity: 0; }
  .d { color: var(--blue); } .p { color: var(--purple); } .s { color: var(--red); }
  .ivec { position: absolute; width: 80px; height: 68px; line-height: 68px; text-align: center; font-size: 34px; }
  #eqsign { position: absolute; left: 543px; top: 126px; width: 50px; height: 68px; line-height: 68px; text-align: center; font-size: 38px; }
  #legend { position: absolute; left: 0; top: 270px; width: 780px; height: 26px; display: flex; justify-content: center; gap: 30px; font-size: 19px; line-height: 26px; }
  #legend .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

  /* ---------- drops: a value falls from the banner into its cell ---------- */
  /* value clones: lift off a component, project straight into a matrix cell in 0.25 s, then leave the layout (display: none) */
  .xfer { display: none; position: absolute; left: 0; top: 0; width: 130px; height: 56px; text-align: center; font-size: 42px; line-height: 56px; opacity: 0; z-index: 40; text-shadow: 0 0 14px currentColor; font-weight: 400; }

  /* ---------- CTA: glass panel in the free space under the matrix (largest panel inside the 90-990 / 1670 safe zone) ---------- */
  #cta { left: 90px; top: 1376px; width: 900px; height: 290px; border-radius: 36px; background: rgba(30,30,46,.62); border: 1px solid rgba(255,255,255,.14); opacity: 0; }
  .cl { position: absolute; left: 0; width: 898px; text-align: center; white-space: nowrap; opacity: 0; }
  #cl1 { top: 12px; font-size: 41.8px; line-height: 52px; color: var(--red); text-shadow: 0 0 22px rgba(255,0,68,.45); }
  #cl2 { top: 64px; font-size: 41.8px; line-height: 52px; color: var(--red); text-shadow: 0 0 22px rgba(255,0,68,.45); }
  #cl2 svg { display: inline-block; width: 30px; height: 38px; vertical-align: -6px; margin-left: 12px; }
  #cl3 { top: 134px; font-size: 30.9px; line-height: 40px; color: var(--blue); }
  #cl4 { top: 176px; font-size: 30.9px; line-height: 40px; color: var(--blue); }
  #cl5 { top: 236px; font-size: 23.6px; line-height: 30px; color: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920" data-fps="60">

  <div id="hdr" class="abs">
    <div id="title">THE R-MATRIX TRICK</div>
    <div id="subtitle">SOLVE MESH CURRENTS BY INSPECTION</div>
    <div id="rule"></div>
  </div>

  <div id="plate" class="abs">
    <div id="wm" data-layout-ignore>@MAE.Academy</div>
    <svg id="circuit" viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
{{CIRCUIT_SVG}}
    </svg>
    <div id="labels">
{{CIRCUIT_LABELS}}
    </div>
{{HOOK}}
  </div>

  <div id="banner" class="abs">
{{BANNER}}
  </div>

  <div id="card" class="abs">
    <div id="cardin">
      <div id="eqhead">{{HEAD_EQ}}</div>
      <svg id="brk" viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg">{{BRACKETS}}</svg>
{{MATRIX}}
      <div id="eqsign">=</div>
      <div id="legend"><span><i class="sw" style="background:#0088FF"></i>self</span><span><i class="sw" style="background:#B026FF"></i>shared</span><span><i class="sw" style="background:#FF0044"></i>sources</span></div>
    </div>
  </div>
{{FLY}}

  <div id="cta" class="abs">
    <div id="cl1" class="cl">{{CTA_1}}</div>
    <div id="cl2" class="cl">{{CTA_2}}<svg viewBox="0 0 24 30"><path d="M3 2h18v26l-9-7-9 7z" fill="#FF0044" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div id="cl3" class="cl">{{CTA_3}}</div>
    <div id="cl4" class="cl">{{CTA_4}}</div>
    <div id="cl5" class="cl">{{CTA_5}}</div>
  </div>

  <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="{{DURATION}}" data-track-index="2" data-volume="1"></audio>
</div>

<script>const DATA = {{DATA_JSON}};</script>
<script>
{{TIMELINE_JS}}
</script>
</body>
</html>
