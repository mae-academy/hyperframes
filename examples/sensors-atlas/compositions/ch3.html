  <script>
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
function capCascade(tl, scene) {
  document.querySelectorAll('[id^="cap-' + scene + '-"]').forEach((el) => {
    const t0 = parseFloat(el.dataset.start),
      dur = parseFloat(el.dataset.duration);
    const ws = el.querySelectorAll(".w");
    ws.forEach((w, i) =>
      tl.fromTo(
        w,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" },
        t0 + 0.04 + i * 0.085,
      ),
    );
    tl.fromTo(
      el.querySelector(".cap-in"),
      { opacity: 1 },
      { opacity: 0, duration: 0.14, ease: "power2.in", immediateRender: false },
      t0 + dur - 0.14,
    );
  });
}
// cut-the-curve LEFT: exit x 0 -> -230 (power4.in 0.34s, fade done by 0.2s), entry +230 -> 0 (power4.out, 0.42s, ignites at .35)
function seamIn(tl, st) {
  tl.fromTo(
    st,
    { x: 230, opacity: 0.35 },
    { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
    0,
  );
}
function seamOut(tl, dur, st) {
  tl.fromTo(
    st,
    { x: 0 },
    { x: -230, duration: 0.34, ease: "power4.in", immediateRender: false },
    dur - 0.34,
  );
  tl.fromTo(
    st,
    { opacity: 1 },
    { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
    dur - 0.34,
  );
}
// word-by-word entry (waterfall entry, binary opacity) for title blocks
function wordsIn(tl, sel, t0, gap = 0.09) {
  document
    .querySelectorAll(sel + " .tw")
    .forEach((w, i) =>
      tl.fromTo(
        w,
        { opacity: 0, y: 50 },
        { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" },
        t0 + i * gap,
      ),
    );
}
// fade-and-rise for a block inside a clip
function popIn(tl, sel, t0, dur = 0.38, from = { x: 230, opacity: 0 }) {
  tl.fromTo(sel, from, { x: 0, y: 0, opacity: 1, duration: dur, ease: "power4.out" }, t0);
}
function slideOut(tl, sel, t0, dur = 0.34) {
  tl.fromTo(
    sel,
    { x: 0, opacity: 1 },
    { x: -230, opacity: 0, duration: dur, ease: "power4.in", immediateRender: false },
    t0,
  );
}

// faint perspective floor grid for the 2D scenes (static)
function drawFloor(svg) {
  let s = "";
  const vx = 960,
    hz = 360;
  for (let i = 0; i <= 14; i++) {
    const y = hz + (1080 - hz) * Math.pow(i / 14, 1.8);
    s += `<line x1="0" y1="${y.toFixed(1)}" x2="1920" y2="${y.toFixed(1)}" stroke="#1565FF" stroke-opacity=".11" stroke-width="2"/>`;

    // ---------- labels (DOM built once, positioned per frame) ----------
    const LBL = [];
    const labRoot = document.getElementById("labels");
    sl.forEach((s, i) => (SENS[s.id].lab || []).forEach(([k, fn, al]) => { const el = document.createElement("div"); el.className = "lb"; el.innerHTML = '<bdi class="m" dir="ltr">' + TEXD[k] + "</bdi>"; labRoot.appendChild(el); LBL.push({ el, i, fn, al }); }));
    const cache = {};
    const $ = (id) => cache[id] || (cache[id] = document.getElementById(id));
    // ---------- schedule: everything on the 3D side is a pure function of time ----------
    const EDGE0 = 8.2;
    function sched(s, loc) {
      const d = SENS[s.id], [p0, p1, pe] = d.p, q = d.q, edgeEnd = s.T - 1.6, backEnd = s.T - 0.9;
      const mainK = ease((loc - 3.0) / 4.0), edgeK = ease((loc - EDGE0) / (edgeEnd - EDGE0)), backK = ease((loc - edgeEnd - 0.3) / (backEnd - edgeEnd - 0.3));
      let p = loc < 3 ? p0 : lerp(p0, p1, mainK), qq = q ? q[0] : 0;
      let lo = Math.min(p0, p), hi = Math.max(p0, p);
      if (loc >= EDGE0) {
        if (q) { qq = lerp(q[0], q[1], edgeK * (1 - backK)); }
        else { p = lerp(p1, pe, edgeK * (1 - backK)); lo = Math.min(lo, p, p1); hi = Math.max(hi, p, p1); }
        if (!q && loc > edgeEnd) { lo = Math.min(p0, p1, pe); hi = Math.max(p0, p1, pe); }
      }
      return { p, q: qq, lo: Math.min(lo, p1 < p0 ? p1 : lo), hi: Math.max(hi, p1 > p0 ? (loc > 7 ? p1 : hi) : hi) };
    }
    const endState = (s) => ({ p: SENS[s.id].p[1], q: SENS[s.id].q ? SENS[s.id].q[0] : 0 });
    const overview = (v) => ({ yaw: v.yaw - 0.7, pitch: v.pitch + 0.12, dist: v.dist + 9, tx: v.tx, tz: v.tz });
    const lerpView = (a, b, m) => { for (const k of ["yaw", "pitch", "dist"]) cam[k] = lerp(a[k], b[k], m); cam.dist *= 1.12; cam.tx = lerp(a.tx, b.tx, m); cam.tz = lerp(a.tz, b.tz, m); cam.ty = 0; };
    const num = (v, d) => v.toFixed(d);
    function drawScope(s, st, alpha) {
      const d = SENS[s.id]; if (alpha <= 0.01) return "";
      const [x0, x1] = d.x, [y0, y1] = d.y, X = (v) => 96 + ((v - x0) / (x1 - x0)) * 604, Y = (v) => 228 - ((v - y0) / (y1 - y0)) * 200, bip = y0 < 0, zy = bip ? Y(0) : 228, zx = x0 < 0 ? X(0) : 96;
      const cv = d.sc || d.out, N = d.ns || 90, cl = (v) => clamp(v, y0, y1), tk = (v) => (Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v * 100) / 100));
      let o = `<g opacity="${alpha.toFixed(3)}"><line x1="96" y1="${zy}" x2="700" y2="${zy}" stroke="${COL.navy}" stroke-width="4" stroke-linecap="round"/><line x1="${zx}" y1="20" x2="${zx}" y2="228" stroke="${COL.navy}" stroke-width="4" stroke-linecap="round"/>`;
      const tx = (x, v, a) => `<text x="${x}" y="266" font-family="Inter" font-weight="700" font-size="34" fill="${COL.navy}" text-anchor="${a}">${tk(v)}</text>`;
      o += tx(96, x0, "middle") + tx(700, x1, "middle") + `<text x="84" y="${Y(y1) + 10}" font-family="Inter" font-weight="700" font-size="34" fill="${COL.navy}" text-anchor="end">${tk(y1)}</text>`;
      if (bip) o += `<text x="84" y="${Y(y0) + 6}" font-family="Inter" font-weight="700" font-size="34" fill="${COL.navy}" text-anchor="end">${tk(y0)}</text>`;
      const path = (fn, a, b, q) => { let t = ""; for (let i = 0; i <= N; i++) { const x = a + ((b - a) * i) / N; t += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(cl(fn(x, q))).toFixed(1); } return t; };
      const q0 = d.q ? d.q[0] : 0, col = s.col;
