<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>MAE Academy — Logic Circuit Simulator: Half Adder → Full Adder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      /* KaTeX 0.16.8 faces, shipped locally (MAE_STYLE_SPEC §3). KaTeX_Math-Italic.woff2 already IS the italic. */
      @font-face { font-family: "KaTeX_Main"; src: url("assets/fonts/KaTeX_Main-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "KaTeX_Main"; src: url("assets/fonts/KaTeX_Main-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "KaTeX_Math"; src: url("assets/fonts/KaTeX_Math-Italic.woff2") format("woff2"); font-weight: 400; font-style: normal; }

      :root {
        --flame-red: #ff0044; --electric-blue: #0088ff; --neon-purple: #b026ff; --pure-white: #ffffff;
        --dark-bg: #0a0a10; --plate: #12121c; --grid-line: #161622; --wire-off: #2a2a3c; --dim: #8a8aa8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark-bg); }
      body { font-family: "KaTeX_Main", serif; font-weight: 700; color: #fff; }
      #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--dark-bg); }
      #scene { position: absolute; inset: 0; isolation: isolate; }
      #scene > * { position: absolute; }

      /* ---- atmosphere ---- */
      #bgGrid { inset: 0; z-index: -30; opacity: .9;
        background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, #000 45%, transparent 100%);
        mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, #000 45%, transparent 100%); }
      #glowA { inset: 0; z-index: -29; background: radial-gradient(900px 620px at 50% 34%, rgba(0,136,255,.08), transparent 70%); }
      #glowB { inset: 0; z-index: -28; background: radial-gradient(800px 520px at 50% 80%, rgba(176,38,255,.07), transparent 70%); }

      .v { font-family: "KaTeX_Math"; font-weight: 400; font-style: normal; }
      sub { font-family: "KaTeX_Main"; font-weight: 700; font-size: .62em; vertical-align: -.24em; line-height: 0; }
      sub.v { font-family: "KaTeX_Math"; font-weight: 400; }
      .fm { font-family: "KaTeX_Main"; font-weight: 700; }
      .fv { font-family: "KaTeX_Math"; font-weight: 400; }

      /* ---- Zone 1 : window chrome + title + URL bar (y 110-258) ---- */
      #chrome { left: 90px; top: 110px; width: 900px; height: 40px; border-radius: 16px; background: rgba(30,30,46,.55); border: 1px solid rgba(255,255,255,.08); }
      #chrome .dot { position: absolute; top: 12px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
      #title { left: 90px; top: 152px; width: 900px; height: 56px; font-size: 50px; line-height: 56px; text-align: center; color: var(--electric-blue); white-space: nowrap; }
      #urlbar { left: 260px; top: 214px; width: 560px; height: 44px; border-radius: 22px; background: #12121c; border: 1px solid rgba(255,255,255,.12); box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 400; font-size: 22px; line-height: 44px; color: rgba(255,255,255,.6); white-space: nowrap; }

      /* ---- Zone 2 : workspace ---- */
      #plate { left: 90px; top: 330px; width: 900px; height: 750px; border-radius: 28px; background: var(--plate); border: 2px solid rgba(255,255,255,.08); z-index: -20;  box-shadow: inset 0 0 0 rgba(0,136,255,0); }
      #wm { left: 90px; top: 655px; width: 900px; height: 100px; text-align: center; font-size: 88px; line-height: 100px; color: #fff; opacity: .06; z-index: -10; white-space: nowrap; }
      #dock { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      .tile { position: absolute; width: 164px; height: 74px; border-radius: 16px; background: rgba(30,30,46,.6); border: 1.5px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 4px; padding-left: 6px; }
      .tile span { font-size: 18px; line-height: 20px; color: #fff; }
      .tile svg { flex: 0 0 52px; }
      #stage { left: 0; top: 0; width: 1080px; height: 1920px; }
      #status { left: 114px; top: 1044px; height: 26px; font-size: 20px; line-height: 26px; color: var(--dim); white-space: nowrap; }
      #status .z { position: relative; display: inline-block; width: 58px; height: 26px; vertical-align: top; }
      #status .z b { position: absolute; left: 0; top: 0; }

      /* ---- SVG circuit primitives ---- */
      #stage text { font-weight: 700; }
      .wire path { fill: none; stroke-linejoin: round; stroke-linecap: butt; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-width: 5; }
      .wire .b { stroke: var(--wire-off); }
      .wire .g { opacity: 1; }
      .wire .lg { stroke-width: 13; opacity: .3; }
      .wire .pg { stroke-width: 12; opacity: 0; }
      .wire .p { stroke: #fff; stroke-width: 4; opacity: 0; }
      .wire .f { stroke: #fff; stroke-width: 2.5; opacity: 0; }
      .sf { opacity: 0; }

      /* ---- Zone 3 : banner (y 1210-1370) ---- */
      #banner { left: 180px; top: 1102px; width: 720px; height: 122px; border-radius: 24px; background: rgba(255,0,68,.08); border: 2px solid rgba(255,0,68,.4); box-shadow: 0 0 26px rgba(255,0,68,0.12), inset 0 0 22px rgba(255,0,68,0.06); overflow: hidden; }
      .pg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; opacity: 0; padding: 0 16px; white-space: nowrap; }
      .pg.col { flex-direction: column; gap: 4px; }
      .pg .l { display: flex; align-items: center; }
      .pg .t { font-size: 28px; line-height: 36px; color: #fff; }
      .pg.big .m { font-size: 56px; line-height: 58px; color: #fff; -webkit-text-stroke: 1.5px #0088ff; text-shadow: 0 0 18px rgba(0,136,255,.7); }
      .pg.big .ck { width: 38px; height: 38px; flex: 0 0 38px; }
      .pg .t24 { font-size: 24px; line-height: 30px; }
      .pg .m { font-size: 30px; line-height: 36px; color: #fff; }
      .pg .q { display: inline-block; width: 16px; }
      .pg .sep { color: var(--flame-red); margin: 0 6px; }
      #bn1 .t, #bn4 .t { color: var(--neon-purple); }
      .pg .bolt { margin-left: 12px; }
      .pg .ck { margin-left: 12px; flex: 0 0 26px; }

      /* ---- Zone 4 : truth-table card + CTA ---- */
      #card { left: 150px; top: 1232px; width: 780px; height: 208px; border-radius: 26px; overflow: hidden;
        background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)), rgba(30,30,46,.5); border: 1px solid rgba(255,255,255,.1); }
      .tt { position: absolute; inset: 0; }
      .grp { position: absolute; top: 8px; }
      .grp.ha { left: 158px; }
      .th, .tr { display: flex; align-items: center; height: 33px; position: relative; }
      .th { height: 36px; }
      .tr { opacity: .25; }
      .ha .tr { height: 40px; }
      .c { display: block; flex: 0 0 54px; text-align: center; font-size: 30px; line-height: 33px; color: var(--dim); position: relative; z-index: 1; font-weight: 700; }
      .ha .c { line-height: 40px; }
      .th .c { color: #fff; line-height: 36px; }
      .th .v { font-size: 30px; }
      .ts { display: block; flex: 0 0 16px; height: 24px; position: relative; z-index: 1; }
      .ha .ts { flex-basis: 24px; }
      .ts::before { content: ""; position: absolute; left: calc(50% - 1px); top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.2); }
      .tr .bg { position: absolute; left: -6px; right: -6px; top: 1px; bottom: 1px; border-radius: 10px; background: rgba(0,136,255,.2); border: 2px solid rgba(0,136,255,.75); opacity: 0; box-shadow: 0 0 0 rgba(0,136,255,0); }
      .tr .ck { position: absolute; top: 5px; width: 22px; height: 22px; opacity: 0; z-index: 2; filter: drop-shadow(0 0 5px #0088ff); }
      .fa .ck { right: 4px; }
      .ha .ck { right: -34px; top: 9px; }

      /* ---- gamified challenge card (y 1460-1640) ---- */
      #cta { left: 150px; top: 1460px; width: 780px; height: 180px; border-radius: 26px; background: rgba(176,38,255,.08); border: 2px solid rgba(176,38,255,.5); opacity: 0; }
      #ctaHead { position: absolute; left: 0; right: 0; top: 12px; height: 44px; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 32px; line-height: 44px; color: var(--neon-purple); white-space: nowrap; }
      #ctaBtn { position: absolute; left: 48px; top: 78px; width: 680px; height: 75px; border-radius: 22px; background: rgba(0,136,255,.18); border: 2px solid #0088ff; box-sizing: border-box; box-shadow: 0 0 10px rgba(0,136,255,.25); }
      #ctaRing { position: absolute; inset: -2px; border-radius: 22px; border: 3px solid #0088ff; opacity: 0; }
      #ctaBtn .b1 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; white-space: nowrap; }
      #ctaBtn .big { font-size: 38px; line-height: 40px; color: var(--electric-blue); text-shadow: 0 0 18px rgba(0,136,255,.8); }
      #ctaBtn .sub { font-size: 24px; line-height: 26px; color: rgba(255,255,255,.7); }
      #ctaB .big { color: #fff; }

      /* ---- cursor ---- */
      #ring { left: 0; top: 0; width: 0; height: 0; z-index: 59; }
      #ring i { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--electric-blue); box-shadow: 0 0 18px rgba(0,136,255,.8); opacity: 0; }
      #cursor { left: 0; top: 0; width: 0; height: 0; z-index: 60; }
      #cursor svg { position: absolute; left: 0; top: 0; filter: drop-shadow(0 0 7px rgba(0,136,255,.95)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <div id="scene">
        <div id="bgGrid"></div>
        <div id="glowA"></div>
        <div id="glowB"></div>

        <!-- Zone 1 -->
        <div id="chrome" data-layout-ignore>
          <i class="dot" style="left:20px;background:#ff5f56;border:1px solid rgba(224,68,62,0.9)"></i>
          <i class="dot" style="left:44px;background:#ffbd2e;border:1px solid rgba(222,161,35,0.9)"></i>
          <i class="dot" style="left:68px;background:#27c93f;border:1px solid rgba(26,171,41,0.9)"></i>
        </div>
        <div id="title">DIGITAL FULL ADDER</div>
        <div id="urlbar"><svg width="16" height="20" viewBox="0 0 16 20"><rect x="2" y="9" width="12" height="9" rx="2" fill="rgba(255,255,255,.6)"/><path d="M4.5 9 V6 a3.5 3.5 0 0 1 7 0 V9" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/></svg><span>maeacademy.org/sim/logic-adder</span></div>

        <!-- Zone 2 -->
        <div id="plate"></div>
        <div id="wm" data-layout-ignore>@MAE.Academy</div>
        <div id="dock" data-layout-ignore>@@DOCK@@</div>
        <svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glowM" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <pattern id="dots" x="-10" y="-10" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.6" fill="rgba(255,255,255,0.14)"/></pattern>
            <clipPath id="plateClip"><rect x="92" y="332" width="896" height="746" rx="26"/></clipPath>
          </defs>
          <g clip-path="url(#plateClip)" data-layout-allow-overflow><g id="worldFade"><g id="world">
@@WORLD@@
          </g></g></g>
        </svg>
        <div id="status" data-layout-ignore><span class="fm">SNAP ON &nbsp;|&nbsp; GRID 20 PX &nbsp;|&nbsp; ZOOM</span> <span class="z"><b id="z100" class="fm">100%</b><b id="z75" class="fm" style="opacity:0">75%</b></span></div>

        <!-- Zone 3 -->
        <div id="banner">@@BANNER@@</div>

        <!-- Zone 4 -->
        <div id="card">@@TABLES@@</div>
        <div id="cta">
          <div id="ctaHead"><svg width="34" height="30" viewBox="0 0 34 30" overflow="visible"><path d="M17 3 V27 M17 8 C10 3 3 7 6 13 C2 16 5 22 10 21 C11 26 16 26 17 22 M17 8 C24 3 31 7 28 13 C32 16 29 22 24 21 C23 26 18 26 17 22" fill="none" stroke="#B026FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>CAN YOU BUILD A 4-BIT ADDER?</span></div>
          <div id="ctaBtn"><i id="ctaRing"></i>
            <div class="b1" id="ctaA"><span class="big">LAUNCH FREE SIMULATOR <svg width="22" height="30" viewBox="0 0 22 30" style="vertical-align:-3px" overflow="visible"><polygon points="13,0 0,17 9,17 7,30 22,11 12,11" fill="#0088FF"/></svg></span><span class="sub">LINK IN PINNED COMMENT &amp; BIO</span></div>
            <div class="b1" id="ctaB" style="opacity:0"><span class="big">SIMULATOR READY <svg width="26" height="30" viewBox="0 0 26 30" style="vertical-align:-4px" overflow="visible"><path d="M13 1 C19 7 20 14 18 21 H8 C6 14 7 7 13 1 Z" fill="#fff" stroke="#0088FF" stroke-width="2"/><path d="M8 17 L3 24 L9 22 M18 17 L23 24 L17 22" fill="#0088FF"/><circle cx="13" cy="11" r="2.6" fill="#0088FF"/></svg></span><span class="sub">LINK IN PINNED COMMENT &amp; BIO</span></div>
          </div>
        </div>

        <div id="ring"><i></i></div>
        <div id="cursor"><svg width="40" height="46" viewBox="0 0 40 46" overflow="visible"><g id="cArrow"><polygon points="0,0 0,30 7.5,23.5 13,36 19.5,33 14,21 23.5,21" fill="#ffffff" stroke="#0088ff" stroke-width="3" stroke-linejoin="round"/></g></svg></div>
      </div>

      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="25" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const WP = @@WP@@;
      const WL = @@WL@@; // wire lengths in world units (for absolute-unit light packets) // wire vertex lists (world coords), emitted by scripts/build_index.py
@@TIMELINE@@
    </script>
  </body>
</html>
